<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Cinema - Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      padding: 1.5rem;
    }
    .login-container {
      width: 100%;
      max-width: 480px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .cinema-icon {
      font-size: 4rem;
      margin-bottom: 0.75rem;
      display: inline-block;
      animation: gentle-bounce 3s infinite ease-in-out;
    }
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .login-title {
      font-size: 2rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .login-subtitle {
      font-size: 1.15rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .password-wrap {
      position: relative;
      margin-bottom: 1.5rem;
    }
    .password-input {
      width: 100%;
      height: 64px;
      padding: 0 4.5rem 0 1.5rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 16px;
      color: #fff;
      transition: all 0.2s ease;
      box-sizing: border-box;
    }
    .password-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.2);
    }
    .toggle-visibility-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
    }
    .submit-btn {
      width: 100%;
      height: 64px;
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      box-shadow: 0 10px 20px rgba(245, 158, 11, 0.25);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(245, 158, 11, 0.35);
    }
    .submit-btn:active {
      transform: translateY(0);
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 12px;
      font-size: 1.05rem;
      margin-top: 1.25rem;
      display: none;
    }
    .hint-text {
      margin-top: 1.75rem;
      font-size: 0.95rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="cinema-icon">🎬</div>
    <h1 class="login-title">Family Cinema</h1>
    <p class="login-subtitle">Enter family password to watch movies</p>

    <form id="loginForm" autocomplete="on">
      <div class="password-wrap">
        <input
          type="password"
          id="passwordInput"
          class="password-input"
          placeholder="Password"
          required
          autofocus
        />
        <button type="button" id="togglePasswordBtn" class="toggle-visibility-btn" aria-label="Toggle password view">
          👁️
        </button>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">
        <span>Enter Cinema</span>
        <span>→</span>
      </button>

      <div id="errorMsg" class="error-msg"></div>
    </form>

    <div class="hint-text">
      🔒 Private streaming server. Password is set on host computer.
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const input = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    toggleBtn.addEventListener('click', () => {
      if (input.type === 'password') {
        input.type = 'text';
        toggleBtn.textContent = '🙈';
      } else {
        input.type = 'password';
        toggleBtn.textContent = '👁️';
      }
      input.focus();
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Verifying...</span>';

      const controller = new AbortController();
      const timeoutTimer = setTimeout(() => controller.abort(), 8000);

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: input.value }),
          signal: controller.signal
        });
        clearTimeout(timeoutTimer);

        let data = {};
        try {
          data = await res.json();
        } catch (jsonErr) {
          data = { error: 'Server returned error ' + res.status + '. Is the server running?' };
        }

        if (res.ok && data.success) {
          submitBtn.innerHTML = '<span>Success! Redirecting...</span>';
          window.location.href = '/';
        } else {
          errorMsg.textContent = data.error || 'Incorrect password. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Enter Cinema</span><span>→</span>';
          input.select();
        }
      } catch (err) {
        clearTimeout(timeoutTimer);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Enter Cinema</span><span>→</span>';

        if (err.name === 'AbortError') {
          errorMsg.textContent = 'Connection timed out. The laptop streaming server appears to be offline.';
        } else {
          errorMsg.textContent = 'Cannot reach server. Make sure the laptop server is running.';
        }
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
